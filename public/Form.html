<!DOCTYPE html>
<html>
<head>
<script>(function(){try{var t=localStorage.getItem('tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<base target="_top">
<meta charset="utf-8">
<!-- `maximum-scale=1` existe para o app NÃO se deslocar ao tocar num campo.
     A fonte de 16px nos campos já deveria bastar — é a regra conhecida do
     Safari — e mesmo assim o zoom continuou acontecendo no iPhone. Isto o
     encerra por definição, não por dedução.
     Não custa acessibilidade: desde o iOS 10 o Safari IGNORA maximum-scale e
     user-scalable para o zoom por pinça, respeitando-os apenas para o zoom
     automático de foco — que é exatamente o que se quer bloquear aqui. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mozi's App">
<meta name="application-name" content="Mozi's App">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<title>Mozi's App</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#FFFFFF; --stage:#EDEEF0;
  --texto:#202124; --texto2:#5f6368; --texto3:#9aa0a6;
  --borda-input:#DADCE0; --borda-card:#EBEBEB; --borda-card2:#F1F1F1;
  --chip-neutro:#EDEEF0; --suave:#F8F9FA;
  --verde:#2F5233;
  /* Sinal do efeito no acerto: verde = a receber, vermelho = a pagar. */
  --pos:#1E7B4F; --neg:#C0392B;
  --irwin:#1F4E79; --irwin-l:#D9E7F5;
  --maria:#6A1B9A; --maria-l:#EADCF5;
  --conjunta:#5f6368; --conjunta-l:#F1F3F4;
  --fixa:#A63A2E; --fixa-l:#F6DCD8;
  --var:#B8860B; --var-l:#FBEED0;
  --entrada:#0F6E56; --entrada-l:#D6EFE6;
  /* André. Âmbar queimado: fora do azul do Irwin, do roxo da Maria e das nove
     cores de categoria — conferido contra as onze. */
  --andre:#B85C00; --andre-l:#FBE3CC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1E1E; --stage:#121212;
    --texto:#E8EAED; --texto2:#9AA0A6; --texto3:#6C7075;
    --borda-input:#4B4F54; --borda-card:#333438; --borda-card2:#2A2B2E;
    --chip-neutro:#2A2A2D; --suave:#232326;
    --verde:#4CAF6D;
    --pos:#4CAF6D; --neg:#E38B7D;
    --irwin:#6FA8DC; --irwin-l:#16233A;
    --maria:#C58AF0; --maria-l:#2A1F3D;
    --conjunta:#9AA0A6; --conjunta-l:#2A2B2E;
    --fixa:#E38B7D; --fixa-l:#3A1F1C;
    --var:#E6BD5C; --var-l:#3A2F14;
    --entrada:#5CE0BE; --entrada-l:#123027;
    --andre:#E39A4E; --andre-l:#3A2A16;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1E1E1E; --stage:#121212;
  --texto:#E8EAED; --texto2:#9AA0A6; --texto3:#6C7075;
  --borda-input:#4B4F54; --borda-card:#333438; --borda-card2:#2A2B2E;
  --chip-neutro:#2A2A2D; --suave:#232326;
  --verde:#4CAF6D;
  --pos:#4CAF6D; --neg:#E38B7D;
  --irwin:#6FA8DC; --irwin-l:#16233A;
  --maria:#C58AF0; --maria-l:#2A1F3D;
  --conjunta:#9AA0A6; --conjunta-l:#2A2B2E;
  --fixa:#E38B7D; --fixa-l:#3A1F1C;
  --var:#E6BD5C; --var-l:#3A2F14;
  --entrada:#5CE0BE; --entrada-l:#123027;
  --andre:#E39A4E; --andre-l:#3A2A16;
}
:root[data-theme="light"]{ color-scheme: light; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:var(--stage);color:var(--texto);
     -webkit-font-smoothing:antialiased}
#boot{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--texto2);font-size:14px}
#app{display:none;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;
     background:var(--bg);position:relative;overflow:hidden}

/* header */
header{padding:8px 16px 11px;padding-top:calc(8px + env(safe-area-inset-top));
       border-bottom:1px solid var(--borda-card);display:flex;align-items:center;
       justify-content:space-between;flex:0 0 auto;background:var(--bg);z-index:5}
header .titulo{display:flex;align-items:center;gap:8px}
header .voltar{font-size:22px;color:var(--texto2);cursor:pointer;line-height:1;padding:2px 4px 2px 0}
header h1{margin:0;font-size:22px;font-weight:500;color:var(--texto)}
.avatares{display:flex;gap:6px;align-items:center}
.avatar{width:28px;height:28px;border-radius:999px;object-fit:cover;display:block;
        border:1px solid var(--borda-card)}
.btn-tema{border:none;background:var(--chip-neutro);color:var(--texto);width:30px;height:30px;
      border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;
      cursor:pointer;padding:0;line-height:1}

/* offline banner */
#offline{display:none;background:#FBEED0;color:#7a5c00;font-size:12px;text-align:center;padding:6px 10px}
#offline.on{display:block}

/* content */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.pad{padding:13px 13px calc(13px + env(safe-area-inset-bottom))}
.screen{display:none}
.screen.on{display:block}

/* tab bar */
nav.tabs{display:flex;border-top:1px solid var(--borda-card);padding:8px 0 calc(8px + env(safe-area-inset-bottom));
         flex:0 0 auto;background:var(--bg)}
nav.tabs button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
                gap:4px;font-family:inherit;cursor:pointer;color:var(--texto2);padding:4px 0}
nav.tabs button.on{color:var(--verde)}
nav.tabs svg{display:block}
nav.tabs span{font-size:13px}
nav.tabs button.on span{font-weight:500}

/* cards / fields */
/* Densidade dos contêineres: 338px dos 694 da área útil eram consumidos antes
   do primeiro lançamento aparecer. Cada pixel devolvido aqui vira lista. */
.card{background:var(--bg);border:1px solid var(--borda-card);border-radius:12px;padding:12px;margin-bottom:10px}
.campo{margin-bottom:11px}
.campo:last-child{margin-bottom:0}
.campo>label{display:block;font-size:13px;color:var(--texto2);margin:0 0 5px}
/* 16px NÃO é escolha estética: o Safari do iPhone dá zoom automático em
   qualquer campo com fonte MENOR que 16px, e o zoom não volta sozinho — a tela
   fica deslocada até o usuário fechar e reabrir. Abaixo deste valor a
   experiência inteira se desconfigura ao tocar num campo.
   Se um campo precisar parecer menor, mude padding ou largura, nunca a fonte. */
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--borda-input);border-radius:8px;
  background:var(--bg);color:var(--texto);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde)}
input[type=date]{-webkit-appearance:none;appearance:none}
input[type=date]::-webkit-date-and-time-value{text-align:left}
/* `input.valor-grande` e não `.valor-grande`: o seletor base acima é
   `input[type=text]`, cuja especificidade (0,1,1) vence uma classe sozinha
   (0,1,0) — em qualquer ordem no arquivo. Por isso o campo de valor nasceu
   com a fonte do seletor base e o prefixo "R$" ao lado dele, que é um span
   fora dessa disputa, aparecia MAIOR que o próprio número. Acrescentar o
   elemento empata a especificidade, e aí a ordem decide a favor desta regra. */
input.valor-grande{font-size:16px;font-weight:700;letter-spacing:.2px}
.valor-wrap{position:relative}
/* O "R$" acompanha o campo em tamanho E peso: foi o descompasso entre os dois
   que fazia o prefixo aparecer maior que o próprio número. */
.valor-wrap .prefixo{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--texto2);font-size:16px;font-weight:700}
.valor-wrap input{padding-left:40px}
.row{display:flex;gap:10px}
/* `min-width:0` não é enfeite: item de flex nasce com `min-width:auto`, que
   é o tamanho mínimo do CONTEÚDO. Dois `input[type=date]` lado a lado num
   celular de 375px pedem mais que a metade cada um, e o segundo vazava para
   fora do cartão — a janela de datas do Dashboard ficou assim por meses. */
.row>*{flex:1;min-width:0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:none;border-radius:8px;padding:9px 13px;font-size:15px;font-weight:500;cursor:pointer;
      font-family:inherit;color:var(--texto);background:var(--chip-neutro)}
.chip.seg{flex:1;text-align:center}
/* Foto dentro do chip de pagador: reconhecer uma cara é mais rápido que ler um
   nome, e as fotos já estão no app. */
.chip-foto{width:20px;height:20px;border-radius:999px;object-fit:cover;flex:0 0 20px;margin-right:-2px}
.chip{display:inline-flex;align-items:center;gap:7px}
/* O botão que marca o gasto como do André, ao lado da descrição.
   Apagado e sem cor quando é gasto de todos; a foto acesa e emoldurada quando é
   dele. Não precisa de rótulo — a cara dele é o rótulo, e é a mesma foto que
   aparece na lista. */
.linha-desc{display:flex;gap:9px;align-items:stretch}
.linha-desc input{flex:1;min-width:0}
.btn-andre{flex:0 0 46px;border:1px solid var(--borda-input);border-radius:8px;background:var(--bg);
      display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:.15s}
.btn-andre img{width:28px;height:28px;border-radius:999px;object-fit:cover;
      filter:grayscale(1);opacity:.4;transition:.15s}
.btn-andre.on{border-color:var(--andre);background:var(--andre-l)}
.btn-andre.on img{filter:none;opacity:1}

/* switch */
.switch-row{display:flex;align-items:center;justify-content:space-between}
.switch-row b{font-size:15px;font-weight:500}
.toggle{position:relative;width:44px;height:26px;flex:0 0 44px}
.toggle input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:2;cursor:pointer}
.toggle .trilho{position:absolute;inset:0;background:var(--borda-input);border-radius:999px;transition:.15s}
.toggle .trilho:before{content:"";position:absolute;width:18px;height:18px;left:4px;top:4px;background:#fff;
      border-radius:999px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle input:checked + .trilho{background:var(--verde)}
.toggle input:checked + .trilho:before{transform:translateX(18px)}

/* stepper */
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:30px;height:30px;border-radius:999px;border:none;background:var(--conjunta-l);
      font-size:16px;cursor:pointer;color:var(--texto)}
.stepper b{font-size:16px;min-width:20px;text-align:center}

/* preview parcelas */
.preview{margin-top:12px;background:var(--suave);border:1px solid var(--borda-card);border-radius:10px;overflow:hidden}
.preview h4{margin:0;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto2);
      border-bottom:1px solid var(--borda-card)}
.preview ul{list-style:none;margin:0;padding:0;max-height:150px;overflow-y:auto}
.preview li{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--borda-card2)}
.preview li:last-child{border-bottom:none}
.preview li span{color:var(--texto2)}
.preview li b{font-variant-numeric:tabular-nums}
.preview .tot{background:var(--suave);font-weight:700}

/* bottom bar */
.barra-acao{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--borda-card);flex:0 0 auto}
.btn-full{width:100%;padding:14px;font-size:15px;font-weight:700;color:#fff;background:var(--borda-input);
      border:none;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-full.valido{background:var(--verde)}

/* Caminho para a tela de série. Aparece só quando o lançamento pertence a uma
   — a esmagadora maioria é avulsa e não deve ganhar botão nenhum. */
.btn-serie{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
      margin-top:8px;padding:13px 14px;border:1px solid var(--borda-input);border-radius:8px;
      background:var(--bg);color:var(--texto);font-size:14px;font-weight:500;
      text-decoration:none;box-sizing:border-box}
.btn-serie .seta{color:var(--texto3);font-size:16px}

/* mensagens */
.msg-erro{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;background:#FBE3E1;color:#8C2A1E;
      border:1px solid #EFB8B0;display:none}
.msg-erro.on{display:block}

/* acerto de contas */
.card-acerto{background:var(--suave);border:1px solid var(--borda-card)}
.acerto-titulo-linha{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.card-acerto .rotulo{font-size:12px;color:var(--texto2)}
.acerto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acerto-box{border:1px solid var(--borda-card);border-radius:12px;padding:10px 6px;text-align:center}
.acerto-box-titulo{font-size:12px;font-weight:700;margin-bottom:8px}
.acerto-box-comparacao{display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:8px}
/* Desenho compacto do acerto: 73px contra os 160 das três caixas.
   O par de fotos aparece UMA vez, e a direção dos dois cortes de apoio vem do
   sinal e da cor — a mesma linguagem da lista. Isso só é possível porque o app
   sabe quem está olhando; sem isso, o card volta às três caixas.
   Medido no histórico: em 35 dos 114 meses os três cortes apontam para lados
   DIFERENTES, então mostrar a direção de cada um não é detalhe. */
.acerto-linha{display:flex;align-items:center;gap:8px}
/* O VALOR nunca trunca; quem encolhe é o texto ao lado.
   Cortar "R$ 5.204,..." é pior que cortar "Maria de...", porque o par de fotos
   ao lado já diz quem deve a quem — o número não tem substituto. */
.acerto-frase{flex:1;min-width:0;display:flex;align-items:baseline;gap:5px;font-size:15px}
.acerto-frase .quem{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acerto-frase b{flex:0 0 auto;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
/* A sigla do mês em 12px, não em 15: maiúscula custa largura, e em 15px
   'Até 31 MAR' estoura os 75px que sobram ao lado do valor. Medido nos 12
   meses com valor de quatro dígitos — em 12px todos cabem sem reticência. */
.acerto-frase .mes{font-size:12px;font-weight:500;letter-spacing:.3px}
.acerto-proj{font-size:12.5px;color:var(--texto3);margin-top:7px;font-variant-numeric:tabular-nums}
/* Dívida de terceiro: linha discreta, e só quando existe. Não é card porque
   não é da mesma conta do acerto — misturar as duas coisas num bloco só faria
   parecer que uma soma na outra. Fica fora do card de propósito. */
a.linha-terceiros{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;padding:9px 12px;
  border:1px solid var(--borda-card);border-radius:12px;background:var(--bg);
  text-decoration:none;color:inherit;font-size:13px}
a.linha-terceiros .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--texto2)}
a.linha-terceiros b{flex:0 0 auto;font-weight:700;font-size:14px;color:var(--pos);font-variant-numeric:tabular-nums}
a.linha-terceiros .seta{flex:0 0 auto;color:var(--texto3)}
.acerto-proj .pos{color:var(--pos);font-weight:700}
.acerto-proj .neg{color:var(--neg);font-weight:700}
.acerto-linha .avatar-acerto{width:22px;height:22px;flex:0 0 22px}
.avatar-acerto{width:26px;height:26px;border-radius:999px;object-fit:cover;flex:0 0 26px;
      border:1.5px solid #fff;box-shadow:0 0 0 1px var(--borda-card)}
.acerto-sinal{font-size:15px;font-weight:800;color:var(--texto2);flex:0 0 auto}
.acerto-box-valor{font-size:12px;font-weight:700;white-space:nowrap}
/* 12px e não 14: no desenho compacto do acerto faltavam exatamente 2px para
   "Maria deve" caber ao lado do valor. O botão não perde área de toque — a
   altura, que é o que importa no dedo, continua a mesma. */
.btn-quitar{flex:0 0 auto;border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;
      color:#fff;background:var(--verde);cursor:pointer;font-family:inherit}

/* link para a planilha */

/* separador de mês/ano */
.mes-separador{padding:11px 0 5px;font-size:12.5px;font-weight:700;color:var(--texto2);
      text-transform:uppercase;letter-spacing:.4px}
.mes-separador:first-child{padding-top:0}

/* lista recentes */
/* Densidade: o texto CRESCE e a lista fica mais curta. O espaço vem do respiro
   entre os elementos e da largura recuperada pelo efeito no acerto de um lado
   só — não de apertar a fonte. Medido: 7 lançamentos por tela viram 9. */
.item-lanc{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--borda-card2);cursor:pointer}
.item-lanc:last-child{border-bottom:none}
.col-data{width:32px;text-align:center;flex:0 0 32px}
.col-data .dia{font-size:16px;font-weight:500}
.col-data .mes{font-size:10px;color:var(--texto3);text-transform:uppercase}
.avatar-mini{width:24px;height:24px;border-radius:999px;object-fit:cover;flex:0 0 24px;
      border:1.5px solid #fff;box-shadow:0 0 0 1px var(--borda-card)}
/* Pago pelos dois: um círculo só, dividido ao meio — Irwin à esquerda, Maria à direita.
   Cada metade recorta uma camada do tamanho do círculo INTEIRO (200% da metade), então
   nenhuma das duas fotos distorce nem aparece pela metade do rosto. */
.avatar-duo{position:relative;overflow:hidden;background:var(--chip-neutro)}
.avatar-duo i{position:absolute;top:0;height:100%;width:50%;overflow:hidden}
.avatar-duo i.esq{left:0}
.avatar-duo i.dir{right:0;border-left:1px solid #fff}
.avatar-duo i::before{content:'';position:absolute;top:0;height:100%;width:200%;
      background-size:cover;background-position:center}
.avatar-duo i.esq::before{left:0}
.avatar-duo i.dir::before{right:0}
.dot-cat{width:6px;height:6px;border-radius:999px;flex:0 0 6px}
/* A foto de quem o gasto é. O anel na cor dele separa os papéis: sem ele, duas
   fotos coladas viram uma mancha só e parece que DUAS PESSOAS pagaram. */
.tag-andre{width:22px;height:22px;border-radius:999px;object-fit:cover;flex:0 0 22px;
      box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--andre)}
/* Quem não tem foto vira iniciais no mesmo lugar, com o mesmo anel. */
.tag-inicial{display:inline-flex;align-items:center;justify-content:center;
      background:var(--andre);color:#fff;font-size:9px;font-weight:700;
      letter-spacing:.02em;box-sizing:border-box}
/* Marca da parcela, irmã do ⟳ do recorrente. */
.tag-parcela{display:inline-flex;align-items:center;font-size:10px;font-weight:700;
      color:var(--texto2);background:var(--chip-neutro);border-radius:3px;padding:0 4px;
      margin-right:5px;vertical-align:1px;letter-spacing:.02em}
.item-info{flex:1;min-width:0}
.item-info .desc{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-recorrente{display:inline-flex;color:var(--verde);margin-right:4px;vertical-align:-1px}
.item-info .meta{font-size:11px;color:var(--texto3);margin-top:2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-valor{text-align:right;flex:0 0 auto}
.item-valor .v{font-size:16px;font-weight:700}
.item-valor .partes{font-size:11.5px;color:var(--texto3);margin-top:2px;white-space:nowrap}
.item-valor .partes .pos{color:var(--pos);font-weight:500}
.item-valor .partes .neg{color:var(--neg);font-weight:500}
/* Quitação não é despesa: ganha selo próprio no lugar da bolinha de categoria. */
.badge-quit{width:14px;height:14px;border-radius:999px;flex:0 0 14px;display:flex;
      align-items:center;justify-content:center;font-size:9px;line-height:1}
.vazio{color:var(--texto3);font-size:13px;padding:8px 0}

/* Selo do lote: a linha diz de onde veio e o toque leva ao lote inteiro.
   Fica no fim da descrição, não na frente, para não empurrar o texto. */
.tag-fatura{display:inline-flex;align-items:center;font-size:10px;font-weight:700;
      color:var(--var);background:var(--var-l);border-radius:3px;padding:0 4px;
      margin-left:6px;vertical-align:1px;letter-spacing:.02em;cursor:pointer}
/* O evento não é lançamento: sem coluna de data, sem foto, sem valor à direita
   com sinal de acerto. É uma faixa que marca o dia em que algo entrou em bloco. */
.item-evento{display:flex;align-items:center;gap:9px;padding:9px 10px;margin:6px 0;
      border:1px dashed var(--borda-input);border-radius:8px;cursor:pointer;
      background:var(--suave)}
.item-evento .ic{flex:0 0 22px;height:22px;border-radius:999px;display:flex;
      align-items:center;justify-content:center;font-size:11px;
      background:var(--var-l);color:var(--var)}
.item-evento .txt{flex:1;min-width:0}
.item-evento .txt .t{font-size:13px;font-weight:600;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
.item-evento .txt .s{font-size:11px;color:var(--texto3);margin-top:1px}
.item-evento .seta{color:var(--texto3);font-size:15px}

/* botão importar */
.btn-importar{width:100%;border:1px solid var(--borda-input);border-radius:8px;padding:12px;background:var(--bg);
      color:var(--verde);font-weight:500;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:12px}

/* busca de lançamentos */
.busca-lanc{margin-bottom:9px}
/* Filtros numa faixa que rola na horizontal, sempre visível: filtro escondido
   atrás de menu é filtro esquecido. */
.filtros{display:flex;gap:7px;overflow-x:auto;padding:1px 0 9px;
      -webkit-overflow-scrolling:touch;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.fchip{position:relative;flex:0 0 auto;border:1px solid var(--borda-input);background:var(--bg);
      color:var(--texto2);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:500;
      display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;
      font-family:inherit;line-height:1.4}
.fchip.on{background:var(--verde);border-color:var(--verde);color:#fff}
.fchip.on-andre{background:var(--andre);border-color:var(--andre);color:#fff}
.fchip img{width:16px;height:16px;border-radius:999px;object-fit:cover}
.fchip .x{opacity:.75;font-weight:400}
/* O <select> fica invisível POR CIMA do chip: o toque abre o seletor nativo do
   celular, que é melhor que qualquer menu improvisado — e vem com rolagem,
   busca e acessibilidade de graça.
   16px pelo mesmo motivo dos outros campos: abaixo disso o iPhone dá zoom. */
/* O campo de data cobre o chip, invisível — tocar em qualquer parte abre o
   calendário nativo. O ✕ fica por cima dele para poder limpar. */
.fchip input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;
      border:none;padding:0;margin:0;cursor:pointer;font-family:inherit;z-index:1}
.fchip .limpa-data{position:relative;z-index:2}
.fchip select{position:absolute;inset:0;width:100%;height:100%;opacity:0;
      border:none;padding:0;font-size:16px;cursor:pointer}
.filtro-resumo{font-size:11.5px;color:var(--texto3);padding:0 0 9px}
.filtro-resumo b{color:var(--texto2);font-weight:500}
.filtro-resumo .limpar{color:var(--verde);font-weight:500;cursor:pointer}
.btn-vermais{width:100%;border:none;background:none;color:var(--verde);font-weight:500;font-size:13px;
      padding:10px 0 0;cursor:pointer;font-family:inherit}
/* Rateio do pagamento ("Ambos"). Espelha as tiles de Parte Irwin / Parte Maria:
   o mesmo tratamento visual para os dois lados da transação — quem pôs o dinheiro
   e de quem é o gasto. */
input.valor-rateio{border:none;background:none;font-size:17px;font-weight:500;width:100%;
      padding:0;font-family:inherit;outline:none}
.btn-metade{width:100%;margin-top:8px;padding:6px;background:none;
      border:1px dashed var(--borda-input);border-radius:8px;color:var(--texto2);
      font-weight:500;font-size:11px;cursor:pointer;font-family:inherit}
.confere-rateio{margin-top:8px;font-size:11px;text-align:center;color:var(--texto2)}
.confere-rateio.erro{color:#C5221F;font-weight:500}
/* "Ver lançamentos futuros": fica ACIMA da lista e precisa se distinguir do
   "Ver mais" — menor, tracejado, na cor de texto secundário. */
.btn-futuros{width:100%;margin-bottom:10px;padding:6px 0;background:none;
      border:1px dashed var(--borda-input);border-radius:8px;color:var(--texto2);
      font-weight:500;font-size:11px;cursor:pointer;font-family:inherit}

/* dropzone */
.dropzone{border:1.5px dashed var(--borda-input);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer}
.dropzone .icone{font-size:26px;color:var(--texto3)}
.dropzone .principal{font-size:15px;font-weight:500;margin-top:10px}
.dropzone .secundario{font-size:12px;color:var(--texto2);margin-top:4px}
.nota{font-size:12px;color:var(--texto2);margin-top:14px;line-height:1.5}

/* dashboard */
.dash-card h3{margin:0 0 10px;font-size:13px;font-weight:500}
.dash-card .sub{font-size:11px;color:var(--texto2);margin:-6px 0 10px}
.barra-empilhada{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--chip-neutro)}
.legenda{display:flex;gap:14px;font-size:11px;color:var(--texto2);margin-top:8px}
.legenda span{display:flex;align-items:center;gap:5px}
.legenda i{width:8px;height:8px;border-radius:2px;display:inline-block}
.cat-linha{margin-bottom:10px}
.cat-linha .topo{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.cat-linha .barra-fundo{height:8px;border-radius:999px;background:var(--chip-neutro)}
.cat-linha .barra-cheia{height:100%;border-radius:999px}
.badge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:999px}
.aviso-dash{font-size:11.5px;line-height:1.45;color:var(--texto2);background:var(--suave);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.aviso-dash b{color:var(--texto);font-weight:500}
.filtro-rot{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--texto2);font-weight:500;margin:0 0 9px}
.numerao{font-size:26px;font-weight:500;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.dash-card .sub-num{margin:2px 0 12px}
.nota-dash{font-size:11.5px;color:var(--texto2);margin-top:10px;line-height:1.5}
.nota-dash b{color:var(--texto);font-weight:500}
.barra-dupla{display:flex;height:100%;border-radius:999px;overflow:hidden}
.barra-alta{height:14px}
.legenda-quebra{flex-wrap:wrap;gap:6px 14px}
.duas-partes{display:flex;gap:10px;margin-top:12px}
.parte-dash{flex:1;min-width:0;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.parte-dash span{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.parte-dash b{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.parte-dash small{font-size:11px}
/* Nosso fixo: altura = reais, % dentro. A coluna do último mês fechado é a
   cheia; as outras, a mesma cor mais rala — legível nos dois temas. */
.colunas{display:flex;align-items:flex-end;gap:8px;height:112px}
.colunas .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.colunas .rs{font-size:10.5px;font-weight:500;margin-bottom:4px;font-variant-numeric:tabular-nums}
.colunas .barra{width:100%;border-radius:4px 4px 0 0;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:3px;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb, var(--fixa) 35%, transparent);color:var(--texto)}
.colunas .barra.atual{background:var(--fixa);color:var(--fixa-l)}
.colunas .eixo{font-size:10px;color:var(--texto2);margin-top:6px}
/* Doze barras não cabem em 375px: a faixa rola, e nasce no mês mais recente. */
.colunas.muitas{overflow-x:auto;scrollbar-width:none;gap:6px}
.colunas.muitas::-webkit-scrollbar{display:none}
.colunas.muitas .col{flex:0 0 34px}
.chips-pessoa{margin:0 0 10px}
.chips-pessoa .chip{padding:6px 10px;font-size:13px}
.legenda-topo{margin:-2px 0 12px}
.fv{margin-bottom:14px}
.fv-topo{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
.fv-topo span{color:var(--texto2)}
.fv-topo b{font-weight:500;font-variant-numeric:tabular-nums}
.fv-valores{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:500;margin-bottom:4px;font-variant-numeric:tabular-nums}
.barra-pct{display:flex;height:18px;border-radius:6px;overflow:hidden}
.barra-pct div{display:flex;align-items:center;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.barra-pct .pf{background:var(--fixa);color:var(--fixa-l);padding-left:7px}
.barra-pct .pv{background:var(--var);color:var(--var-l);justify-content:flex-end;padding-right:7px}
.tabela-div{margin-top:10px}
.tabela-div .lin{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0;border-top:1px solid var(--borda-card)}
.tabela-div .lin:first-child{border-top:none}
.tabela-div i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.tabela-div .nome{flex:1}
.tabela-div .rs{font-variant-numeric:tabular-nums;font-weight:500}
.tabela-div .pc{width:46px;text-align:right;color:var(--texto2);font-variant-numeric:tabular-nums}
.mes-lin{display:flex;align-items:center;gap:10px;padding:9px 0;width:100%;border:none;border-top:1px solid var(--borda-card);
  background:none;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.mes-lin.primeira{border-top:none}
.mes-lin .quem{flex:1;min-width:0}
.mes-lin .quem b{font-weight:500}
.mes-lin .quem small{display:block;font-size:11px;color:var(--texto2);margin-top:1px}
.mes-lin .total{font-weight:500;font-variant-numeric:tabular-nums;color:var(--fixa)}
.seta-mes{width:14px;height:14px;color:var(--texto2);flex:0 0 auto;transition:transform .15s}
.mes-lin.aberta .seta-mes{transform:rotate(90deg)}
.mes-itens{background:var(--suave);border-radius:8px;padding:2px 10px 8px;margin-bottom:4px}
.grupo-rot{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto2);margin:10px 0 3px;font-weight:500}
.item-c{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:4px 0}
.item-c .d{flex:1;min-width:0}
.item-c .tag{font-size:10px;color:var(--texto2);margin-left:5px;white-space:nowrap}
.item-c .tag.ult{color:var(--verde)}
.item-c .v{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.seta-mes{transition:none}}

/* overlay sucesso */
.overlay{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:0 30px;z-index:40}
.overlay.on{display:flex}
.overlay .circulo{width:56px;height:56px;border-radius:999px;background:var(--entrada-l);color:var(--entrada);
      display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
.overlay .titulo-ok{font-size:17px;font-weight:500}
.overlay .msg-ok{font-size:13px;color:var(--texto2);margin-top:6px}
.overlay button{margin-top:22px;background:var(--verde);color:#fff;border:none;border-radius:8px;
      padding:12px 22px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}

/* importação */
.pill{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:999px;margin-top:3px}
.imp-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--borda-card2)}
.imp-item:last-child{border-bottom:none}
.imp-item .col-data{width:32px}
.imp-item .desc{font-size:13px}
.imp-item .valor{font-size:13px;font-weight:500;flex:0 0 auto}
</style>
</head>
<body>

<div id="boot">Carregando…</div>

<div id="app">
  <div id="offline">Sem conexão — as alterações não serão salvas.</div>

  <header>
    <div class="titulo">
      <span class="voltar" id="btnVoltar" style="display:none">‹</span>
      <h1 id="headerTitulo">Início</h1>
    </div>
    <div class="avatares">
      <button class="btn-tema" id="btnTema" type="button" title="Alternar tema"></button>
      <img class="avatar" id="avatarHeaderIrwin" alt="Irwin">
      <img class="avatar" id="avatarHeaderMaria" alt="Maria">
      <img class="avatar" id="avatarHeaderAndre" alt="André">
    </div>
  </header>

  <div class="content" id="content">

    <!-- INÍCIO -->
    <div class="screen" id="screen-home">
      <div class="pad">
        <div class="card card-acerto" id="cardAcerto">
          <div class="acerto-linha" id="acertoCompacto" style="display:none">
            <img class="avatar-acerto" id="acAv1" alt="">
            <span class="acerto-sinal" id="acSeta">→</span>
            <img class="avatar-acerto" id="acAv2" alt="">
            <div class="acerto-frase" id="acFrase">—</div>
          </div>
          <div class="acerto-proj" id="acProj" style="display:none"></div>
          <div class="acerto-titulo-linha" id="acertoTituloLinha">
            <div class="rotulo">Acerto de contas</div>
            <button class="btn-quitar" id="btnQuitar" style="display:none">Quitar</button>
          </div>
          <div class="acerto-grid" id="acertoGrid">
            <div class="acerto-box">
              <div class="acerto-box-titulo" id="rotuloAcertoMes">Mês</div>
              <div class="acerto-box-comparacao">
                <img class="avatar-acerto" id="avatarAcertoMes1" alt="">
                <span class="acerto-sinal" id="sinalAcertoMes">→</span>
                <img class="avatar-acerto" id="avatarAcertoMes2" alt="">
              </div>
              <div class="acerto-box-valor" id="valorAcertoMes">—</div>
            </div>
            <div class="acerto-box">
              <div class="acerto-box-titulo" id="rotuloAcertoProxMes">Próx. mês</div>
              <div class="acerto-box-comparacao">
                <img class="avatar-acerto" id="avatarAcertoProxMes1" alt="">
                <span class="acerto-sinal" id="sinalAcertoProxMes">→</span>
                <img class="avatar-acerto" id="avatarAcertoProxMes2" alt="">
              </div>
              <div class="acerto-box-valor" id="valorAcertoProxMes">—</div>
            </div>
            <div class="acerto-box">
              <div class="acerto-box-titulo">Total</div>
              <div class="acerto-box-comparacao">
                <img class="avatar-acerto" id="avatarAcertoTotal1" alt="">
                <span class="acerto-sinal" id="sinalAcertoTotal">→</span>
                <img class="avatar-acerto" id="avatarAcertoTotal2" alt="">
              </div>
              <div class="acerto-box-valor" id="valorAcertoTotal">—</div>
            </div>
          </div>
        </div>
        <a class="linha-terceiros" id="linhaTerceiros" href="/terceiros" style="display:none">
          <span class="q" id="terceirosTexto"></span>
          <b id="terceirosValor"></b>
          <span class="seta">›</span>
        </a>
        <div class="card">
          <label style="display:block;font-size:12px;color:var(--texto2);margin-bottom:8px">Lançamentos recentes</label>
          <input type="text" id="buscaLanc" class="busca-lanc" placeholder="Buscar por nome, data ou valor">
          <div class="filtros" id="filtrosLanc"></div>
          <div class="filtro-resumo" id="filtroResumo" style="display:none"></div>
          <button class="btn-futuros" id="btnFuturos" style="display:none"></button>
          <div id="listaUltimos"><div class="vazio">Carregando…</div></div>
          <button class="btn-vermais" id="btnVerMais" style="display:none">Ver mais</button>
        </div>
      </div>
    </div>



    <!-- DASHBOARD -->
    <div class="screen" id="screen-dashboard">
      <div class="pad">
        <div class="filtro-rot">De quem</div>
        <div class="chips chips-pessoa" id="chipsPessoa"></div>
        <div class="card" id="cardFiltroDash">
          <div class="filtro-rot">Período · vale para a tela toda</div>
          <select id="dashPreset" aria-label="Período">
            <option value="ultimo">Último mês fechado</option>
            <option value="3m">3 meses fechados</option>
            <option value="12m">12 meses fechados</option>
            <option value="ano">Este ano</option>
            <option value="tudo">Tudo</option>
            <option value="custom">Personalizado</option>
          </select>
          <div class="row" style="margin-top:9px">
            <input type="date" id="dashDataIni" aria-label="De">
            <input type="date" id="dashDataFim" aria-label="Até">
          </div>
        </div>
        <div class="aviso-dash" id="avisoCorrente"></div>
        <div id="dashConteudo"><div class="vazio">Carregando…</div></div>
      </div>
    </div>

    <!-- IMPORTAR -->
    <div class="screen" id="screen-import">
      <div class="pad" id="importConteudo"></div>
    </div>

    <!-- overlay sucesso -->
    <div class="overlay" id="overlaySucesso">
      <div class="circulo">✓</div>
      <div class="titulo-ok" id="overlayTitulo">Salvo</div>
      <div class="msg-ok" id="overlayMsg"></div>
      <button id="btnOverlayOk">Ver lançamentos</button>
    </div>
  </div>

  <nav class="tabs" id="tabbar">
    <button data-tab="home">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
      <span>Início</span>
    </button>
    <button data-tab="new">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Lançar</span>
    </button>
    <button data-tab="dashboard">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="3.5" height="8" rx="1"/><rect x="10.25" y="6" width="3.5" height="14" rx="1"/><rect x="16.5" y="9" width="3.5" height="11" rx="1"/></svg>
      <span>Dashboard</span>
    </button>
  </nav>
</div>

<input type="file" id="arquivoInput" accept=".ofx,.csv,.txt,.xlsx,.pdf" style="display:none">

<script>
const CATS = {
  '1 Casa':             {forte:'#2F5597', clara:'#D9E2F3'},

  '7 Outros':            {forte:'#6E6E6E', clara:'#E8E8E8'},

  Maria:    {forte:'#6A1B9A', clara:'#EADCF5'},
  Ambos:    {forte:'#5f6368', clara:'#F1F3F4'},
  Conjunta: {forte:'#5f6368', clara:'#F1F3F4'},
  Empate:   {forte:'#5f6368', clara:'#F1F3F4'}
};
const TIPO_COR = {
  'Fixa':        {forte:'#A63A2E', clara:'#F6DCD8'},
  'Variável':    {forte:'#B8860B', clara:'#FBEED0'},

   O backend recebe este objeto como está — `clausulasDe` em src/lib/api.ts.

   Fica AQUI, e não junto de `montarFiltros`, por causa da zona morta temporal:
   `function` é içada e `let` não, então `carregarUltimos` — chamada no boot,
   centenas de linhas acima — quebrava com "Cannot access 'FILTROS' before
   initialization". A sintaxe estava correta; só a execução mostrou. */
/* O padrão é DIVIDIDO, e é decisão de produto, não conveniência.
   A lista era quase toda compartilhada enquanto vinha da planilha do casal —
   98% das linhas. Com a importação de fatura ela passa a receber compra
   pessoal: no último lote, 47 das 55 linhas eram 100% de um só. Sem o padrão,
   o que é dos dois afunda no meio do que é de um. */
const FILTROS_PADRAO = { dividido: true };
/* As chaves que o backend conhece — `clausulasDe` em src/lib/api.ts. A lista
   existe porque o estado volta de fora do código (sessionStorage) e chave
   desconhecida vindo de lá não tem por que chegar ao servidor. */
const CHAVES_FILTRO = ['recorrente', 'parcelado', 'importado', 'quitacao', 'gastoDe',
                       'categoria', 'quemPagou', 'dividido', 'de', 'ate'];
const CHAVE_FILTROS = 'mozis.filtros.v1';
/* Os filtros sobrevivem à navegação, e isso é requisito, não conveniência:
   abrir um lançamento sai desta página para uma página React, e voltar
   recarrega o Form.html do zero. Enquanto FILTROS vivia só na memória, quem
   filtrava novembro para conferir perdia o filtro em TODA edição.
   sessionStorage e não localStorage: vale para esta aba, não para sempre — um
   filtro esquecido de semana passada esconderia linha sem ninguém ter pedido. */
function guardarFiltros(){
  try { sessionStorage.setItem(CHAVE_FILTROS, JSON.stringify(FILTROS)); } catch (e) {}
}
function filtrosGuardados(){
  try {
    const bruto = sessionStorage.getItem(CHAVE_FILTROS);
    if (!bruto) return null;
    const lido = JSON.parse(bruto);
    if (!lido || typeof lido !== 'object' || Array.isArray(lido)) return null;
    const limpo = {};
    CHAVES_FILTRO.forEach(function(k){ if (lido[k]) limpo[k] = lido[k]; });
    return limpo;
  } catch (e) { return null; }
}

/* ---------------- campo de valor estilo caixa eletrônico ---------------- */
function formatarValorMascara(numero){
  const centavos = Math.max(0, Math.round(Number(numero) * 100) || 0);
  let digits = String(centavos);
  while (digits.length < 3) digits = '0' + digits;
  const dec = digits.slice(-2);
  let inteiros = digits.slice(0, -2).replace(/^0+(?=\d)/, '');
  inteiros = inteiros.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return inteiros + ',' + dec;
}
function mascaraValorInput(el){
  el.addEventListener('input', function(){
    const digits = this.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
    this.value = digits ? formatarValorMascara(Number(digits) / 100) : '';
  });
}
function lerValor(id){
  return Number(String($(id).value || '').replace(/\./g, '').replace(',', '.')) || 0;
}

function chip(container, label, ativo, corForte, corClara, onClick, srcFoto){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip';
  if (srcFoto){
    const img = document.createElement('img');
    img.className = 'chip-foto'; img.src = srcFoto; img.alt = '';
    b.appendChild(img);
    b.appendChild(document.createTextNode(label));
  } else {
    b.textContent = label;
  }
  if (ativo){ b.style.background = corForte; b.style.color = '#fff'; }
  else {
    b.style.background = corClara;
    // cores "var(--chip-neutro)" acompanham o tema — deixa o texto herdar
    // a cor padrão do .chip (também var()); cores fixas de categoria/pessoa
    // continuam com texto escuro, já que o fundo pastel delas não muda com o tema.
    b.style.color = corClara.indexOf('var(') === 0 ? '' : '#333';
    // chips com cor própria (categoria/tipo/pessoa) ficam apagados quando
    // não selecionados, pra destacar melhor qual está ativo.
    if (corClara.indexOf('var(') !== 0) b.style.opacity = '.5';
  }
  b.onclick = onClick;
  container.appendChild(b);
  return b;
}

let ACERTO = null;
function preencherAcertoBox(prefixo, saldo){
  const quite = Math.abs(saldo) < 0.005;
  const credor = quite ? null : (saldo > 0 ? 'Irwin' : 'Maria');
  const devedor = credor === 'Irwin' ? 'Maria' : 'Irwin';
  const av1 = $('avatar' + prefixo + '1'), av2 = $('avatar' + prefixo + '2');
  av1.src = quite ? AVATAR_IRWIN : (devedor === 'Irwin' ? AVATAR_IRWIN : AVATAR_MARIA);
  av2.src = quite ? AVATAR_MARIA : (devedor === 'Irwin' ? AVATAR_MARIA : AVATAR_IRWIN);
  av1.alt = quite ? 'Irwin' : devedor;
  av2.alt = quite ? 'Maria' : credor;
  $('sinal' + prefixo).textContent = quite ? '=' : '→';
  $('valor' + prefixo).textContent = quite ? 'Quites' : 'R$ ' + formatarValorMascara(Math.abs(saldo));
}
/* Quanto ESTE corte mexe com quem está olhando, com sinal e cor.
   Positivo é a receber, negativo é a pagar — igual à lista de lançamentos, para
   não haver duas linguagens de sinal no mesmo app. */
function projecaoDoCorte(rotulo, saldoIrwin, eu){
  const s = eu === 'Irwin' ? saldoIrwin : -saldoIrwin;
  if (Math.abs(s) < 0.005) return rotulo + ' <b>quites</b>';
  const cls = s > 0 ? 'pos' : 'neg';
  return rotulo + ' <span class="' + cls + '">' + (s > 0 ? '+' : '−') +
         'R$ ' + formatarValorMascara(Math.abs(s)) + '</span>';
}

/* O card tem DOIS desenhos.
   Compacto (73px) quando o app sabe quem está olhando: uma linha com o par de
   fotos e a frase do total, mais uma linha de apoio com os dois cortes futuros
   por sinal e cor.
   Três caixas (160px) quando não sabe — aí cada corte precisa do próprio par de
   fotos para dizer a direção, e é isso que custa o tamanho. */
function carregarAcerto(){
  google.script.run.withSuccessHandler(function(a){
    ACERTO = a;
    renderAcerto();
  }).withFailureHandler(function(){
    $('btnQuitar').style.display = 'none';
  }).getAcertoContas();
}

function renderAcerto(){
  {
    const a = ACERTO;
    if (!a) return;
    const nomesMes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const siglasMes = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
    const hoje = new Date();
    const eu = OPC && OPC.eu;
    const compacto = (eu === 'Irwin' || eu === 'Maria');

    $('acertoCompacto').style.display  = compacto ? 'flex' : 'none';
    $('acProj').style.display          = compacto ? 'block' : 'none';
    $('acertoTituloLinha').style.display = compacto ? 'none' : 'flex';
    $('acertoGrid').style.display      = compacto ? 'none' : 'grid';

    if (compacto){
      /* O NÚMERO GRANDE é o mês que está fechando, não o total.
         Pedido da Maria, e os números de 04/11/2026 mostram por quê: os três
         cortes apontavam para lados DIFERENTES — até 30/11 quem devia era o
         Irwin, em dezembro e no total era ela. A manchete era justamente o
         corte menos acionável. O total desceu para a linha de apoio, onde
         dezembro já morava; nada saiu da tela e a altura não mudou. */
      const m = a.mesAtual.saldo;
      const quiteMes = Math.abs(m) < 0.005;
      const devedor = quiteMes ? null : (m > 0 ? 'Maria' : 'Irwin');
      $('acAv1').src = quiteMes ? AVATAR_IRWIN : (devedor === 'Irwin' ? AVATAR_IRWIN : AVATAR_MARIA);
      $('acAv2').src = quiteMes ? AVATAR_MARIA : (devedor === 'Irwin' ? AVATAR_MARIA : AVATAR_IRWIN);
      $('acAv1').alt = quiteMes ? 'Irwin' : devedor;
      $('acAv2').alt = quiteMes ? 'Maria' : (devedor === 'Irwin' ? 'Maria' : 'Irwin');
      $('acSeta').textContent = quiteMes ? '=' : '→';
      /* 'Até 30 NOV' no lugar de 'Você deve'.
         Medido: entre as fotos e o botão sobram 172px, e o valor nunca trunca,
         então um valor de quatro dígitos deixa 75px para o texto. 'Maria deve'
         ocupa 73 — os 2px de folga do comentário lá em cima. Não cabem as duas
         coisas, e o mês é o que a tela não dizia. Quem passa a dar a direção é
         o par de fotos com a seta, que é o que o desenho compacto já faz.
         A sigla vai em 12px (ver `.acerto-frase .mes`): em 15px, 'NOV' custa
         7px a mais e MARÇO estoura. Com 12px, os 12 meses cabem. */
      const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
      const corte = '<span class="quem">Até ' + ultimoDia +
                    ' <span class="mes">' + siglasMes[hoje.getMonth()] + '</span></span>';
      $('acFrase').innerHTML = corte + (quiteMes
        ? '<b>quites</b>'
        : '<b>R$ ' + formatarValorMascara(Math.abs(m)) + '</b>');
      $('acProj').innerHTML =
        projecaoDoCorte(nomesMes[(hoje.getMonth() + 1) % 12].toLowerCase(), a.mesSeguinte.saldo, eu) +
        ' · ' +
        projecaoDoCorte('total', a.total.saldo, eu);
      // Move o botão para a linha do saldo. Mover no DOM preserva o onclick já
      // ligado — recriar o elemento o perderia.
      $('acertoCompacto').appendChild($('btnQuitar'));
    } else {
      $('rotuloAcertoMes').textContent = nomesMes[hoje.getMonth()];
      $('rotuloAcertoProxMes').textContent = nomesMes[(hoje.getMonth() + 1) % 12];
      preencherAcertoBox('AcertoMes', a.mesAtual.saldo);
      preencherAcertoBox('AcertoProxMes', a.mesSeguinte.saldo);
      preencherAcertoBox('AcertoTotal', a.total.saldo);
      $('acertoTituloLinha').appendChild($('btnQuitar'));
    }

    const quite = Math.abs(a.mesAtual.saldo) < 0.005;
    $('btnQuitar').style.display = quite ? 'none' : 'block';

    /* A linha de terceiros só aparece quando alguém deve. Vazia ela seria
       ruído permanente numa tela em que cada pixel foi disputado: o card do
       acerto desceu de 161px para 81px justamente para caber mais lançamento.
       E ela diz "fora do acerto" porque o número fica ao lado do saldo do
       casal, e dois números vizinhos são lidos como somáveis. */
    const t = a.terceiros;
    if (t && t.pessoas > 0){
      $('terceirosTexto').textContent =
        (t.pessoas === 1 ? 'Terceiro a receber' : t.pessoas + ' terceiros a receber') +
        ' · fora do acerto';
      $('terceirosValor').textContent = 'R$ ' + formatarValorMascara(t.aberto);
      $('linhaTerceiros').style.display = 'flex';
    } else {
      $('linhaTerceiros').style.display = 'none';
    }
  }
}

/**
 * Recarrega a lista. Por padrão mantém a profundidade já aberta pelo usuário —

function temFiltro(){
