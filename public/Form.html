/** Chip de liga/desliga. */
/* `semX`: chip que NÃO se desliga sozinho, porque é uma das posições de um
   controle (Divididos/Todos). O ✕ promete "clique para remover" e ali o
   clique não remove nada — promessa que a tela não cumpre é defeito. */
function fchip(container, rotulo, ligado, classeExtra, srcFoto, onClick, semX){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'fchip' + (ligado ? ' ' + (classeExtra || 'on') : '');
  if (srcFoto){
    const img = document.createElement('img'); img.src = srcFoto; img.alt = '';
    b.appendChild(img);
  }
  b.appendChild(document.createTextNode(rotulo));
  if (ligado && !semX){
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '✕';
    b.appendChild(x);
  }
  b.onclick = onClick;
  container.appendChild(b);
}

/** Chip que abre o seletor nativo do celular. */
function fchipSelect(container, rotulo, valor, opcoes, onChange){
  const l = document.createElement('label');
  l.className = 'fchip' + (valor ? ' on' : '');
  // Com valor escolhido o chip mostra O QUE está valendo, não o nome do campo:
  // "2 Carro" informa, "Categoria" repete o que já se sabe.
  l.appendChild(document.createTextNode(valor || rotulo));
  const seta = document.createElement('span');
  seta.className = 'x'; seta.textContent = valor ? '✕' : '▾';
  l.appendChild(seta);
  const sel = document.createElement('select');
  const vazio = document.createElement('option');
  vazio.value = ''; vazio.textContent = rotulo + ' — todas';
  sel.appendChild(vazio);
  opcoes.forEach(function(o){
    const op = document.createElement('option');
    op.value = o; op.textContent = o;
    if (o === valor) op.selected = true;
    sel.appendChild(op);
  });
  sel.onchange = function(){ onChange(sel.value); };
  l.appendChild(sel);
  container.appendChild(l);
}

/* Chip de data: abre o calendário nativo do celular.
   Mesmo truque do `fchipSelect` — o campo fica por cima, invisível, ocupando o
   chip inteiro. É o padrão que já funciona aqui; `showPicker()` não é universal
   e o iOS ignora em alguns casos. */
function fchipData(container, rotulo, valor, onChange){
  const l = document.createElement('label');
  l.className = 'fchip' + (valor ? ' on' : '');
  // Com data escolhida o chip mostra A DATA, não o nome do campo — mesma
  // decisão do chip de categoria: "12/10" informa, "de" repete o óbvio.
  const partes = valor ? valor.split('-') : null;
  l.appendChild(document.createTextNode(partes ? partes[2] + '/' + partes[1] : rotulo));

  const inp = document.createElement('input');
  inp.type = 'date';
  inp.value = valor;
  inp.onchange = function(){ onChange(inp.value); };

  if (valor){
    // O ✕ limpa; o resto do chip reabre o calendário. Precisa vir DEPOIS do
    // campo na pilha e parar a propagação, senão o clique atravessa e abre o
    // calendário em vez de limpar.
    const x = document.createElement('span');
    x.className = 'x limpa-data';
    x.textContent = '✕';
    x.onclick = function(e){ e.preventDefault(); e.stopPropagation(); onChange(''); };
    l.appendChild(inp);
    l.appendChild(x);
  } else {
    const seta = document.createElement('span');
    seta.className = 'x'; seta.textContent = '▾';
    l.appendChild(seta);
    l.appendChild(inp);
  }
  container.appendChild(l);
}

function montarFiltros(){
  const c = $('filtrosLanc');
  if (!c) return;
  c.innerHTML = '';
  const alterna = function(campo, valor){
    return function(){ FILTROS[campo] = FILTROS[campo] ? '' : valor; aplicarFiltros(); };
  };
  /* Divididos e Todos são UM controle de duas posições, não dois filtros que
     se somam. Por isso não usam `alterna`: um liga, o outro desliga. Sempre
     um dos dois está aceso, então a tela nunca esconde linha em silêncio. */
  fchip(c, 'Divididos', !!FILTROS.dividido, 'on', null,
        function(){ FILTROS.dividido = true;  aplicarFiltros(); }, true);
  fchip(c, 'Todos',     !FILTROS.dividido,   'on', null,
        function(){ delete FILTROS.dividido;  aplicarFiltros(); }, true);
  fchipData(c, 'de',  FILTROS.de  || '', function(v){ FILTROS.de  = v; aplicarFiltros(); });
  fchipData(c, 'até', FILTROS.ate || '', function(v){ FILTROS.ate = v; aplicarFiltros(); });
  fchip(c, 'André', !!FILTROS.gastoDe, 'on-andre', AVATAR_ANDRE, alterna('gastoDe', 'André'));
  fchip(c, 'Parceladas', !!FILTROS.parcelado, 'on', null, alterna('parcelado', true));
  fchip(c, 'Recorrentes', !!FILTROS.recorrente, 'on', null, alterna('recorrente', true));
  fchip(c, 'Importados', !!FILTROS.importado, 'on', null, alterna('importado', true));
  fchip(c, 'Quitações', !!FILTROS.quitacao, 'on', null, alterna('quitacao', true));
  if (OPC){
    fchipSelect(c, 'Categoria', FILTROS.categoria || '',
      OPC.grupos.map(function(g){ return g.nome; }),
      function(v){ FILTROS.categoria = v; aplicarFiltros(); });
    fchipSelect(c, 'Quem pagou', FILTROS.quemPagou || '', OPC.pagadores,
      function(v){ FILTROS.quemPagou = v; aplicarFiltros(); });
  }
}

/** Com filtro ativo, "quantos e quanto somam" costuma ser a pergunta por trás dele. */
function mostrarResumo(resumo){
  const el = $('filtroResumo');
  if (!resumo || !temFiltro()){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<b>' + resumo.qtd + '</b> ' + (resumo.qtd === 1 ? 'lançamento' : 'lançamentos') +
                 ' · <b>' + brl(resumo.soma) + '</b> · ' +
                 '<span class="limpar" id="limparFiltros">limpar</span>';
  // Volta ao PADRÃO, não ao vazio: zerar desligaria o "Divididos" de lado,
  // e a lista passaria a mostrar compra pessoal sem ninguém ter pedido.
  $('limparFiltros').onclick = function(){
    FILTROS = Object.assign({}, FILTROS_PADRAO); aplicarFiltros();
  };
}

/**
 * A marca de quem é o gasto, quando o gasto é de terceiro.
 *
 * Só o André tem foto. Qualquer outro dono virava a foto DELE com o nome do
 * outro no `title` — e o olho acredita na foto, não no tooltip: gasto do avô
 * da Maria aparecia na lista como gasto do filho. São três donos na base
 * (André, Avô da Maria, Mãe do Irwin), então o caso errado não era hipotético.
 */
function marcaGastoDe(nome){
  if (!nome) return '';
  const atrib = ' alt="' + escapeHtml(nome) + '" title="Gasto de ' + escapeHtml(nome) + '"';
  if (nome === 'André') return '<img class="tag-andre" src="' + AVATAR_ANDRE + '"' + atrib + '>';
  return '<span class="tag-andre tag-inicial"' + atrib + '>' + escapeHtml(iniciaisDe(nome)) + '</span>';
}
/* 'Avô da Maria' vira 'AM' e 'Mãe do Irwin' vira 'MI': as preposições saem,
   senão os dois comecariam por uma letra que não distingue ninguém. */
function iniciaisDe(nome){
  const palavras = String(nome).trim().split(/\s+/)
    .filter(function(w){ return !/^(d[aeo]s?|e)$/i.test(w); });
  const letras = palavras.slice(0, 2).map(function(w){ return w.charAt(0); }).join('');
  return (letras || String(nome).charAt(0) || '?').toUpperCase();
}

/* Reaplica os filtros no caminho certo: se há busca em curso, refiltra o
   resultado dela; senão recarrega a lista. Sem isto, filtrar durante uma busca
   jogaria o usuário de volta para a lista inteira sem aviso. */
function aplicarFiltros(){
  guardarFiltros();
  montarFiltros();
  const termo = $('buscaLanc').value.trim();
  if (termo){ buscaAtiva = true; buscarLanc(termo); }
  else { carregarUltimos({ reset: true }); }
}

function carregarUltimos(opts){
  opts = opts || {};
  if (opts.reset){ profundidadeLista = QTD_RECENTES; }
  buscaAtiva = false;
  // Não apaga a busca quando a recarga vem de um filtro: `aplicarFiltros` já
  // decidiu que não havia termo.
  if (!opts.manterBusca) $('buscaLanc').value = '';
  google.script.run.withSuccessHandler(function(r){
    ULTIMOS = r.itens;
    EVENTOS = r.eventos || [];
    temMaisUltimos = r.temMais;
    qtdFuturos = r.qtdFuturos || 0;
    profundidadeLista = Math.max(QTD_RECENTES, ULTIMOS.length);
    renderUltimos();
    atualizarBotoesLista();
    mostrarResumo(r.resumo);
  }).withFailureHandler(function(){ $('listaUltimos').innerHTML = '<div class="vazio">Erro ao carregar.</div>'; }).ultimosLancamentos(profundidadeLista, 0, mostrarFuturos, FILTROS);
}

function carregarMaisUltimos(){
  const b = $('btnVerMais'); b.textContent = 'Carregando…';
  google.script.run.withSuccessHandler(function(r){
    ULTIMOS = ULTIMOS.concat(r.itens);
    // A janela cresceu: podem ter entrado lotes mais antigos.
    EVENTOS = r.eventos || EVENTOS;
    temMaisUltimos = r.temMais;
    qtdFuturos = r.qtdFuturos || 0;
    profundidadeLista = ULTIMOS.length;
    renderUltimos();
    b.textContent = 'Ver mais';
    atualizarBotoesLista();
  /* FILTROS vai aqui também, e a ausência dele era o defeito: a primeira
     página vinha filtrada e o "Ver mais" trazia a lista inteira a partir do
     offset da lista filtrada — linhas de fora do filtro, em ordem que não
     continuava a de cima. */
  }).withFailureHandler(function(){ b.textContent = 'Ver mais'; }).ultimosLancamentos(QTD_RECENTES, ULTIMOS.length, mostrarFuturos, FILTROS);
}

$('btnFuturos').onclick = function(){
  mostrarFuturos = !mostrarFuturos;
  // Ao revelar, abre espaço para os futuros: senão eles entrariam no topo e
  // empurrariam para fora da lista os passados que já estavam à vista.
  profundidadeLista = mostrarFuturos
    ? profundidadeLista + qtdFuturos
    : Math.max(QTD_RECENTES, profundidadeLista - qtdFuturos);
  carregarUltimos();
};

function buscarLanc(termo){
  google.script.run.withSuccessHandler(function(lista){
    ULTIMOS = lista;
    // Numa busca a lista não é cronológica contínua, e um evento encaixado
    // pela data ficaria no lugar errado. Some.
    EVENTOS = [];
    renderUltimos();
    // A busca tem teto de 60 resultados, então somar aqui responderia outra
    // pergunta. O resumo é da lista filtrada, não da busca.
    $('filtroResumo').style.display = 'none';
  }).withFailureHandler(function(){ $('listaUltimos').innerHTML = '<div class="vazio">Erro na busca.</div>'; }).buscarLancamentos(termo, FILTROS);
}

$('buscaLanc').addEventListener('input', function(){
  const termo = this.value.trim();
  clearTimeout(debounceBusca);
  debounceBusca = setTimeout(function(){
    if (!termo){ carregarUltimos(); return; }
    buscaAtiva = true;
    atualizarBotoesLista();
    $('listaUltimos').innerHTML = '<div class="vazio">Buscando…</div>';
    buscarLanc(termo);
  }, 300);
});

$('btnVerMais').onclick = carregarMaisUltimos;

$('listaUltimos').addEventListener('click', function(e){
  // O lote vem primeiro: o selo mora DENTRO da linha, e sem isto o clique nele
  // abriria a edição do lançamento em vez do lote.
  const lote = e.target.closest('[data-importacao]');
  if (lote){ e.stopPropagation(); location.href = '/importacao/' + lote.dataset.importacao; return; }
  const item = e.target.closest('.item-lanc');
  if (!item) return;
  const linha = Number(item.dataset.linha);
  // Editar saiu daqui: é a MESMA tela de Lançar, agora em React, com os campos
  // preenchidos. O formulário antigo desta página tinha o seu próprio caminho de
  // edição, e foi assim que o `De fora` nasceu no Lançar e sumiu na edição.
  if (linha) location.href = '/lancamento/' + linha;
});

function renderUltimos(){
  if (!ULTIMOS || !ULTIMOS.length){
    $('listaUltimos').innerHTML = '<div class="vazio">' + (buscaAtiva ? 'Nada encontrado.' : 'Nenhum lançamento ainda.') + '</div>';
    return;
  }
  let h = '';
  let mesAtual = null;
  // Os eventos entram pela data, na mesma ordem decrescente da lista.
  const pendentes = (EVENTOS || []).slice().sort(function(a, b){ return a.data < b.data ? 1 : -1; });
  ULTIMOS.forEach(function(x){
    if (x.mesChave && x.mesChave !== mesAtual){
      mesAtual = x.mesChave;
      h += '<div class="mes-separador">' + escapeHtml(x.mesLabel || '') + '</div>';
    }
    while (pendentes.length && pendentes[0].data >= x.data) h += htmlEvento(pendentes.shift());
    const c = CATS[x.categoria] || {forte:'#6E6E6E'};
    const quit = ehQuitacao(x.categoria);
    const marcaCat = quit
      ? '<span class="badge-quit" style="background:' + (c.clara || 'var(--chip-neutro)') + ';color:' + c.forte + '" title="Quitação de acerto de contas">⇄</span>'
      : '<div class="dot-cat" style="background:' + c.forte + '"></div>';
    // 'Conjunta' é o rótulo legado de 'Ambos' — os dois significam pagamento dos dois.
    const pagouAmbos = x.quemPagou === 'Ambos' || x.quemPagou === 'Conjunta';
    const avatarSrc = x.quemPagou === 'Irwin' ? AVATAR_IRWIN : (x.quemPagou === 'Maria' ? AVATAR_MARIA : '');
    const avatarHtml = pagouAmbos
      ? '<span class="avatar-mini avatar-duo" title="Pago por Irwin e Maria"><i class="esq"></i><i class="dir"></i></span>'
      : (avatarSrc ? '<img class="avatar-mini" src="' + avatarSrc + '" alt="' + escapeHtml(x.quemPagou) + '" title="Pago por ' + escapeHtml(x.quemPagou) + '">' : '<span class="avatar-mini" style="background:var(--chip-neutro)"></span>');
    /* A foto do André entra à ESQUERDA do valor, não no começo da linha: assim
       ela não empurra o início das descrições, que continuam todas alinhadas.
       Custa 31px da descrição, e só nas linhas que a têm. */
    const tagAndre = marcaGastoDe(x.gastoDe);
    /* O 'N/M' sai do meio da descrição e vira marca própria, como o ⟳ do
       recorrente já era. Libera o texto e deixa a parcela legível de relance. */
    // ` N/M` (gerado pelo app) e ` (N/M)` (11 linhas antigas, à mão).
    const m = /^(.*) \(?(\d[\d,+]*\/\d+)\)?$/.exec(String(x.descricao || ''));
    const marcaParcela = m ? '<span class="tag-parcela">' + m[2] + '</span>' : '';
    const descricaoLimpa = m ? m[1] : x.descricao;
    /* Veio de um lote: o selo diz de onde, e leva ao lote inteiro. Vai no FIM
       da descrição porque, ao contrário da parcela, não é o que se procura ao
       varrer a lista — é o que se quer quando já se achou. */
    const tagFatura = x.importacaoId
      ? '<span class="tag-fatura" data-importacao="' + x.importacaoId + '" title="Veio de uma importação">fatura</span>'
      : '';
    const tagRecorrente = x.recorrente
      ? '<span class="tag-recorrente" title="Gasto recorrente"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>'
      : '';
    h += '<div class="item-lanc" data-linha="' + x.linha + '">' +
      '<div class="col-data"><div class="dia">' + x.dia + '</div><div class="mes">' + x.mesAbrev + '</div></div>' +
      avatarHtml +
      marcaCat +
      '<div class="item-info"><div class="desc">' + tagRecorrente + marcaParcela + escapeHtml(descricaoLimpa) + tagFatura + '</div>' +
      '<div class="meta">' + (quit ? metaQuitacao(x) : escapeHtml(x.categoria || '') + ' · ' + escapeHtml(x.tipo || '')) + '</div></div>' +
      tagAndre +
      '<div class="item-valor"><div class="v">' + brl(x.valor) + '</div>' +
      efeitoNoAcerto(x.saldoIrwin) + '</div>' +
      '</div>';
  });
  pendentes.forEach(function(ev){ h += htmlEvento(ev); });
  $('listaUltimos').innerHTML = h;
}

/* A faixa de um lote de importação.

   Mostra o que ela É — quantas linhas e quanto somam — e o que ela FEZ no
   acerto. Os dois números são diferentes e os dois importam: uma fatura de
   R$ 18 mil pode ter efeito zero no acerto, porque cada um pagou o próprio
   cartão, e mesmo assim é o maior acontecimento do mês nos gastos. */
function htmlEvento(ev){
  const efeito = Math.abs(Number(ev.efeitoNoAcerto || 0)) < 0.005
    ? 'sem efeito no acerto'
    : 'no acerto: ' + efeitoNoAcertoTexto(ev.efeitoNoAcerto);
  return '<div class="item-evento" data-importacao="' + ev.id + '">' +
    '<span class="ic">\u21E9</span>' +
    '<div class="txt"><div class="t">' + escapeHtml(ev.titulo || 'Importação') + '</div>' +
    '<div class="s">' + ev.qtd + ' lançamentos · ' + brl(ev.total) + ' · ' + efeito + '</div></div>' +
    '<span class="seta">\u203A</span></div>';
}

/* Quitação de acerto não é despesa: é o acerto sendo pago. O backend já a exclui do
   Dashboard; aqui ela ganha marca própria para não se confundir com gasto na lista. */
function ehQuitacao(cat){ return String(cat || '').indexOf('9 ') === 0; }

/** "Quitação · Irwin → Maria" — a direção sai de quem pagou, não do sinal do saldo. */
function metaQuitacao(x){
  const de = x.quemPagou === 'Irwin' ? 'Irwin' : (x.quemPagou === 'Maria' ? 'Maria' : '');
  const para = de === 'Irwin' ? 'Maria' : (de === 'Maria' ? 'Irwin' : '');
  return 'Quitação' + (de ? ' · ' + de + ' → ' + para : '');
}

/* O complemento da linha mostra quanto AQUELA transação mexeu no acerto, com sinal.
   Antes mostrava 'Parte Irwin · Parte Maria', que responde outra pergunta — de quem é
   o gasto — e nunca dizia quem ficou devendo a quem por causa dele.

   Saldo Maria não precisa vir do servidor: é o oposto exato do Saldo Irwin, porque
   'pago' e 'parte' somam o valor cheio dos dois lados. */
function efeitoNoAcerto(saldoIrwin){
  const s = Number(saldoIrwin) || 0;
  // Zero é comum (quem pagou é dono de 100% do gasto, ou cada um pôs a própria parte).
  // Escrever '+R$ 0,00 · −R$ 0,00' seria ruído: melhor dizer que não mexeu.
  if (Math.abs(s) < 0.005) return '<div class="partes">sem impacto</div>';
  const comSinal = function(v){ return (v > 0 ? '+' : '−') + brl(Math.abs(v)); };

  /* Cada um vê só o SEU lado.
     Os dois números sempre foram o mesmo dado: 'M' é o negativo exato de 'I' —
     o comentário logo acima do saldoIrwin já dizia isso. Mostrar os dois gastava
     114px da linha e deixava 91px para a descrição, com 28 de 50 aparecendo
     cortadas. Com um lado só sobram 157px para o nome, que é o que se procura
     ao varrer a lista.
     `OPC.eu` vem da sessão. Quando não identifica ninguém — desenvolvimento, ou
     um e-mail que entra pela lista reserva — voltam os dois lados: mostrar
     demais é melhor que mostrar o lado errado de uma dívida. */
  const eu = OPC && OPC.eu;
  if (eu === 'Irwin' || eu === 'Maria'){
    const meu = eu === 'Irwin' ? s : -s;
    return '<div class="partes"><span class="' + (meu > 0 ? 'pos' : 'neg') + '">' +
           comSinal(meu) + '</span></div>';
  }
  return '<div class="partes">' +
    '<span class="' + (s > 0 ? 'pos' : 'neg') + '">I ' + comSinal(s) + '</span> · ' +
    '<span class="' + (s > 0 ? 'neg' : 'pos') + '">M ' + comSinal(-s) + '</span>' +
    '</div>';
}

/* A mesma conta em texto puro, para onde não cabe marcação — a faixa do lote.
   Chama a de cima e tira as tags: duas versões da regra "cada um vê só o seu
   lado" divergiriam no dia em que uma das duas mudasse. */
function efeitoNoAcertoTexto(saldoIrwin){
  return efeitoNoAcerto(saldoIrwin).replace(/<[^>]+>/g, '');
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* ---------------- Lançar ---------------- */
// Rótulo de cada frequência na frase "um a cada ___" da prévia.
const ROTULO_FREQ = { mensal:'mês', quinzenal:'15 dias', semanal:'semana' };
/* O estado inicial do formulário vivia escrito por extenso em CINCO lugares.
   Acrescentar um campo exigia lembrar dos cinco, e esquecer um daria um defeito
   que só aparece por um caminho específico de navegação. */
/* ---------------- Dashboard ---------------- */
function isoLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* Os atalhos do período TERMINAM TODOS no último mês fechado (C19). O mês
   corrente está sempre incompleto — a fatura dele só entra no seguinte — e
   somá-lo ao lado de meses cheios puxaria tudo para baixo sem ninguém ver.
   Vale para "Este ano" e "Tudo" também; só o Personalizado é livre.
   Em janeiro, "Este ano" ainda não tem mês fechado, e vira o ano passado. */
function janelaPreset(p){
  const h = new Date(), y = h.getFullYear(), m = h.getMonth();
  const fimFechado = isoLocal(new Date(y, m, 0));
  if (p === 'ultimo') return [isoLocal(new Date(y, m - 1, 1)), fimFechado];
  if (p === '3m')  return [isoLocal(new Date(y, m - 3, 1)),  fimFechado];
  if (p === '12m') return [isoLocal(new Date(y, m - 12, 1)), fimFechado];
  if (p === 'ano') return [isoLocal(new Date(new Date(y, m, 0).getFullYear(), 0, 1)), fimFechado];
  return ['', fimFechado];
}
function rotuloPeriodo(){
  const a = FILTRO_DASH.dataIni, b = FILTRO_DASH.dataFim;
  const br = function(s){ const p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0].slice(2); };
  if (!a && !b) return 'Todo o histórico';
  if (a && b) return br(a) + ' a ' + br(b);
  return a ? 'Desde ' + br(a) : 'Até ' + br(b);
}
/* O nome curto de uma janela: "Outubro", "Ago a out", "Nov/25 a out/26".
   Em meses só quando a janela é de meses inteiros; senão, as datas. */
function nomeIntervalo(ini, fim){
  if (!ini) return 'Todo o histórico';
  const a = ini.split('-').map(Number), b = fim.split('-').map(Number);
  const ultimoDia = new Date(b[0], b[1], 0).getDate();
  if (a[2] !== 1 || b[2] !== ultimoDia){
    const br = function(p){ return String(p[2]).padStart(2, '0') + '/' + String(p[1]).padStart(2, '0') + '/' + String(p[0]).slice(2); };
    return br(a) + ' a ' + br(b);
  }
  if (a[0] === b[0] && a[1] === b[1]) return cap(MESES_NOMES[a[1] - 1]);
  if (a[0] === b[0]) return cap(MES_CURTO[a[1] - 1]) + ' a ' + MES_CURTO[b[1] - 1];
  return cap(MES_CURTO[a[1] - 1]) + '/' + String(a[0]).slice(2) + ' a ' + MES_CURTO[b[1] - 1] + '/' + String(b[0]).slice(2);
}
function montarFiltroDash(){
  // A opção diz QUAL mês é: "último fechado" muda de sentido todo dia 1º.
  const h = new Date();
  $('dashPreset').options[0].textContent = 'Último mês fechado · ' + MESES_NOMES[new Date(h.getFullYear(), h.getMonth() - 1, 1).getMonth()];
  $('dashPreset').value = FILTRO_DASH.preset;
  $('dashDataIni').value = FILTRO_DASH.dataIni;
  $('dashDataFim').value = FILTRO_DASH.dataFim;
}
/* De quem: todos, ou a PARTE de uma pessoa em cada gasto. Vale para a tela
   toda — o já comprometido incluído. */
function montarPessoaDash(){
  const c = $('chipsPessoa'); c.innerHTML = '';
  [['todos','Todos','#2F5233',null],['irwin','Irwin','var(--irwin)',AVATAR_IRWIN],['maria','Maria','var(--maria)',AVATAR_MARIA]].forEach(function(o){
    const b = chip(c, o[1], FILTRO_DASH.pessoa === o[0], o[2], 'var(--chip-neutro)', function(){
      FILTRO_DASH.pessoa = o[0]; montarPessoaDash(); carregarDashboard();
    }, o[3]);
    b.classList.add('seg');
  });
}
montarFiltroDash();
montarPessoaDash();
/* A lista PREENCHE as datas; mexer numa data vira Personalizado sozinho. Os
   dois caminhos ficam abertos — o atalho para o de sempre, a janela livre para
   quando a pergunta for outra. */
$('dashPreset').addEventListener('change', function(){
  FILTRO_DASH.preset = this.value;
  if (this.value !== 'custom'){ const j = janelaPreset(this.value); FILTRO_DASH.dataIni = j[0]; FILTRO_DASH.dataFim = j[1]; }
  montarFiltroDash(); carregarDashboard();
});
$('dashDataIni').addEventListener('change', function(){ FILTRO_DASH.dataIni = this.value; FILTRO_DASH.preset = 'custom'; montarFiltroDash(); carregarDashboard(); });
$('dashDataFim').addEventListener('change', function(){ FILTRO_DASH.dataFim = this.value; FILTRO_DASH.preset = 'custom'; montarFiltroDash(); carregarDashboard(); });
/* Abrir um mês do "Já comprometido" é só mostrar o que já veio: os itens de
   cada mês chegam junto, escondidos. */
$('dashConteudo').addEventListener('click', function(e){
  const b = e.target.closest('.mes-lin'); if (!b) return;
  const lista = b.nextElementSibling, abrir = lista.hidden;
  lista.hidden = !abrir;
  b.classList.toggle('aberta', abrir);
  b.setAttribute('aria-expanded', abrir ? 'true' : 'false');
});

/* Só a resposta do ÚLTIMO pedido pinta a tela. Trocar o período e a pessoa
   em seguida dispara dois pedidos, e nada garante a ordem em que voltam. O
   contador `DASH_PEDIDO` é declarado lá em cima, junto do DASH, pelo mesmo
   motivo do FILTRO_DASH: o boot chama esta função antes de este bloco rodar. */
function carregarDashboard(){
  const meu = ++DASH_PEDIDO;
  google.script.run.withSuccessHandler(function(d){
    if (meu !== DASH_PEDIDO) return;
    DASH = d; renderDashboard();
  }).getDashboard({ dataIni: FILTRO_DASH.dataIni, dataFim: FILTRO_DASH.dataFim, pessoa: FILTRO_DASH.pessoa });
}

function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function milhar(v){ return (v / 1000).toFixed(1).replace('.', ',') + 'k'; }
function pct1(v){ return v.toFixed(1).replace('.', ',') + '%'; }
const COR_DIV = { '50/50':'var(--conjunta)', 'Custom':'var(--verde)', '100% Maria':'var(--maria)', '100% Irwin':'var(--irwin)', 'Renda':'var(--var)' };
const ROT_DIV = { 'Custom':'Valor exato', 'Renda':'Por renda' };
// Com uma pessoa escolhida, a linha da divisão fala da PARTE dela naquele tipo.
const ROT_DIV_PARTE = { '50/50':'Metade do 50/50', 'Custom':'Parte no valor exato', 'Renda':'Parte no por renda' };

/* Fixo vs. variável: o total em cima, os reais de cada parte nas pontas e o
   % dentro. A legenda (vermelho = fixo, amarelo = variável) aparece uma vez
   só, no topo do card — as palavras não se repetem em cada linha. */
function fvLinha(rotulo, fixa, variavel, opac){
  const tot = fixa + variavel;
  const pF = tot > 0 ? fixa / tot * 100 : 50, pV = 100 - pF;
  const dentro = function(p){ return p >= 9 ? Math.round(p) + '%' : ''; };
  return '<div class="fv"><div class="fv-topo"><span>' + rotulo + '</span><b>' + brl(tot) + '</b></div>' +
    '<div class="fv-valores"><span style="color:var(--fixa)">' + brl(fixa) + '</span><span style="color:var(--var)">' + brl(variavel) + '</span></div>' +
    '<div class="barra-pct" style="opacity:' + opac + '">' +
    '<div class="pf" style="width:' + pF.toFixed(1) + '%">' + dentro(pF) + '</div>' +
    '<div class="pv" style="width:' + pV.toFixed(1) + '%">' + dentro(pV) + '</div></div></div>';
}

function tagsItem(it, tipo){
  let t = '';
  if (tipo === 'rec'){
    if (it.vezes > 1) t += '<span class="tag">' + it.vezes + ' × ' + brl(it.valor) + '</span>';
    if (it.ate){ const p = it.ate.split('-'); t += '<span class="tag">até ' + MES_CURTO[Number(p[1]) - 1] + '/' + p[0].slice(2) + '</span>'; }
  } else if (it.seq){
    const ultima = it.de && it.seq === it.de;
    t += '<span class="tag' + (ultima ? ' ult' : '') + '">' + it.seq + (it.de ? '/' + it.de : '') + (ultima ? ' · última' : '') + '</span>';
  }
  return t;
}
function grupoItens(rotulo, itens, tipo){
  if (!itens.length) return '';
  const soma = itens.reduce(function(a, x){ return a + (tipo === 'rec' ? x.total : x.valor); }, 0);
  let h = '<div class="grupo-rot"><span>' + itens.length + ' ' + rotulo + '</span><span>' + brl(soma) + '</span></div>';
  itens.forEach(function(it){
    h += '<div class="item-c"><span class="d">' + escapeHtml(it.descricao) + tagsItem(it, tipo) + '</span><span class="v">' + brl(tipo === 'rec' ? it.total : it.valor) + '</span></div>';
  });
  return h;
}

function renderDashboard(){
  if (!DASH) return;
  const el = $('dashConteudo');
  const todos = DASH.pessoa === 'todos';
  const gastouN = todos ? 'gastamos' : (DASH.pessoa === 'maria' ? 'a Maria gastou' : 'o Irwin gastou');
  const daParte = todos ? '' : ' da parte ' + (DASH.pessoa === 'maria' ? 'da Maria' : 'do Irwin');
  const ini = DASH.periodo.ini, fim = DASH.periodo.fim;
  const nomeP = nomeIntervalo(ini, fim);
  const umMes = !!ini && nomeP === cap(MESES_NOMES[Number(ini.split('-')[1]) - 1]) && ini.slice(0, 7) === (fim || '').slice(0, 7);

  // O mês em andamento: fora do painel, mas à vista, do tamanho que tem.
  const c = DASH.mesCorrente;
  $('avisoCorrente').innerHTML = '<b>' + cap(c.mes) + ' em andamento:</b> ' + brl(c.total) +
    (todos ? ' em ' + c.qtd + ' lançamentos' : daParte + ' até agora') +
    '. Entra no painel quando fechar, com a fatura de ' + c.proximo + '.';

  let h = '';
  const r = DASH.resumo, an = DASH.anterior;

  /* 1 — Fixo vs. variável, no topo. Substitui os dois quadros que ficavam
     aqui: com o período mandando na tela, eles repetiriam este card. Compara
     com os meses logo antes, do mesmo tamanho — a média dos 6 fechados não
     servia mais, porque com 3 meses escolhidos ela cobria o próprio período. */
  h += '<div class="card dash-card"><h3>Fixo vs. variável</h3>' +
       '<div class="legenda legenda-topo"><span><i style="background:var(--fixa)"></i>Fixo</span><span><i style="background:var(--var)"></i>Variável</span></div>';
  h += fvLinha('<span style="color:var(--texto)">' + nomeP + '</span>', r.fixa, r.variavel, 1);
  if (an){
    const qual = an.anoPassado ? 'os mesmos meses do ano passado' : an.meses === 1 ? 'o mês antes' : an.meses ? 'os ' + an.meses + ' meses antes' : 'o mesmo tanto de dias antes';
    const nomeAnt = nomeIntervalo(an.ini, an.fim) + (an.anoPassado ? ' de ' + an.ini.slice(0, 4) : '');
    h += fvLinha(nomeAnt + ' · ' + (an.anoPassado ? 'ano passado' : qual), an.fixa, an.variavel, .7);
    const dF = r.fixa - an.fixa, dV = r.variavel - an.variavel;
    if (an.fixa + an.variavel > 0){
      const frase = function(nomeT, d){ return nomeT + (d >= 0 ? ' subiu ' : ' caiu ') + '<b>' + brl(Math.abs(d)) + '</b>'; };
      h += '<div class="nota-dash">Contra ' + qual + ', ' + frase('o fixo', dF) + ' e ' + frase('a variável', dV) + '.</div>';
    }
  }
  h += '</div>';

  /* 2 — Nosso fixo. A altura da barra é o fixo em reais, o número em cima
     também, e o % do mês vai dentro. As barras são os meses do período; acima
     de 12 meses viram anos — quem escolhe é o período, não um botão. */
  const fx = DASH.fixo, serie = fx.barras;
  const max = Math.max(1, ...serie.map(function(x){ return x.fixa; }));
  const quando = !ini ? 'no histórico todo' : umMes ? 'em ' + MESES_NOMES[Number(ini.split('-')[1]) - 1] : 'de ' + nomeP.toLowerCase();
  h += '<div class="card dash-card"><h3>' + (todos ? 'Nosso fixo' : 'Fixo ' + (DASH.pessoa === 'maria' ? 'da Maria' : 'do Irwin')) + '</h3>' +
       '<div class="numerao" style="color:var(--fixa)">' + brl(fx.mediaMes) + '</div>' +
       '<div class="sub sub-num">por mês, ' + quando + ' — ' + Math.round(fx.pct) + '% de tudo que ' + gastouN + (umMes ? ' no mês' : ' no período') + '</div>' +
       '<div class="colunas' + (serie.length > 8 ? ' muitas' : '') + '">';
  serie.forEach(function(x, k){
    const destaque = !fx.porAno || k === serie.length - 1;
    const alt = Math.max(16, Math.round(x.fixa / max * 70));
    let rot = x.rotulo;
    if (!fx.porAno){
      const p = x.rotulo.split('-');
      rot = MES_CURTO[Number(p[1]) - 1] + (p[1] === '01' && k > 0 ? '/' + p[0].slice(2) : '');
    }
    h += '<div class="col"><div class="rs"' + (destaque ? ' style="color:var(--fixa)"' : '') + '>' + milhar(x.fixa) + '</div>' +
         '<div class="barra' + (destaque ? ' atual' : '') + '" style="height:' + alt + 'px">' + Math.round(x.pct) + '%</div>' +
         '<div class="eixo">' + rot + '</div></div>';
  });
  h += '</div><div class="legenda legenda-quebra">' +
       '<span>Em cima: ' + (fx.porAno ? 'média de fixo por mês' : 'quanto foi fixo, em reais') + '</span>' +
       '<span>Dentro: que % ' + (fx.porAno ? 'do ano' : 'do mês') + ' isso foi</span></div>';
  if (fx.porAno) h += '<div class="nota-dash">Acima de 12 meses as barras viram anos, e o valor em cima é a <b>média de fixo por mês</b> daquele ano.</div>';
  h += '</div>';

  /* 3 — Gasto por categoria. Em "todos" a barra se divide por de quem é o
     gasto: a parte do Irwin no tom cheio, a da Maria no claro. Com uma pessoa
     escolhida é tudo dela, e a barra é inteira. */
  const cats = DASH.categorias.filter(function(x){ return x.total > 0; });
  const totCat = cats.reduce(function(a, x){ return a + x.total; }, 0);
  const maxCat = Math.max(1, ...cats.map(function(x){ return x.total; }));
  h += '<div class="card dash-card"><h3>Gasto por categoria</h3><div class="sub">' + rotuloPeriodo() + (todos ? '' : ' · parte ' + (DASH.pessoa === 'maria' ? 'da Maria' : 'do Irwin')) + '</div>';
  cats.forEach(function(x){
    const cor = (CATS[x.categoria] || {forte:'#6E6E6E'}).forte;
    const pI = !todos ? 100 : x.total > 0 ? Math.min(100, Math.max(0, x.irwin / x.total * 100)) : 50;
    h += '<div class="cat-linha"><div class="topo"><span>' + escapeHtml(x.categoria.replace(/^\d+\s/, '')) + '</span><b>' + brl(x.total) + '</b></div>' +
         '<div class="barra-fundo"><div class="barra-dupla" style="width:' + (x.total / maxCat * 100).toFixed(1) + '%">' +
         '<div style="width:' + pI.toFixed(1) + '%;background:' + cor + '"></div>' +
         (todos ? '<div style="width:' + (100 - pI).toFixed(1) + '%;background:' + cor + ';opacity:.45"></div>' : '') +
         '</div></div></div>';
  });
  if (todos) h += '<div class="legenda legenda-quebra"><span><i style="background:var(--texto2)"></i>Parte do Irwin (tom escuro)</span>' +
       '<span><i style="background:var(--texto2);opacity:.45"></i>Parte da Maria (tom claro)</span></div>';
  if (cats.length && totCat > 0) h += '<div class="nota-dash"><b>' + escapeHtml(cats[0].categoria.replace(/^\d+\s/, '')) + ' é ' + Math.round(cats[0].total / totCat * 100) + '% ' + (todos ? 'de tudo' : 'do que ' + gastouN) + '</b> no período.</div>';
  h += '</div>';

  /* 4 — Divisão do período. Em "todos", a composição e quanto foi de cada um.
     Com uma pessoa, a pergunta muda: de onde vem a parte dela — quanto foi
     metade de um gasto dividido e quanto foi só dela. O % de cada tipo não
     cabe dentro da barra (os 3% dariam 10 pixels): vai na tabelinha. */
  const dv = DASH.divisao;
  const tipos = dv.porTipo.filter(function(x){ return x.total > 0; });
  const totDiv = tipos.reduce(function(a, x){ return a + x.total; }, 0);
  const meio = tipos.find(function(x){ return x.divisao === '50/50'; });
  h += '<div class="card dash-card"><h3>' + (todos ? 'Divisão do período' : 'De onde vem a parte ' + (DASH.pessoa === 'maria' ? 'da Maria' : 'do Irwin')) + '</h3>';
  if (totDiv > 0 && meio) h += '<div class="sub">' + Math.round(meio.total / totDiv * 100) + '% ' + (todos ? 'do valor saiu meio a meio.' : 'do que ' + gastouN + ' foi metade de um gasto dividido meio a meio.') + '</div>';
  if (totDiv > 0){
    h += '<div class="barra-empilhada barra-alta">';
    tipos.forEach(function(x){ h += '<div style="width:' + (x.total / totDiv * 100).toFixed(2) + '%;background:' + (COR_DIV[x.divisao] || 'var(--texto2)') + '"></div>'; });
    h += '</div><div class="tabela-div">';
    tipos.forEach(function(x){
      const rot = (!todos && ROT_DIV_PARTE[x.divisao]) || ROT_DIV[x.divisao] || x.divisao;
      h += '<div class="lin"><i style="background:' + (COR_DIV[x.divisao] || 'var(--texto2)') + '"></i><span class="nome">' + escapeHtml(rot) + '</span>' +
        '<span class="rs">' + brl(x.total) + '</span><span class="pc">' + pct1(x.total / totDiv * 100) + '</span></div>';
    });
    h += '</div>';
  }
  if (todos){
    const totIM = dv.irwin + dv.maria;
    h += '<div class="duas-partes">' +
         '<div class="parte-dash" style="background:var(--irwin-l);color:var(--irwin)"><span>Gasto do Irwin</span><b>' + brl(dv.irwin) + '</b><small>' + pct1(totIM ? dv.irwin / totIM * 100 : 0) + '</small></div>' +
         '<div class="parte-dash" style="background:var(--maria-l);color:var(--maria)"><span>Gasto da Maria</span><b>' + brl(dv.maria) + '</b><small>' + pct1(totIM ? dv.maria / totIM * 100 : 0) + '</small></div>' +
         '</div>';
  } else if (totDiv > 0){
    h += '<div class="nota-dash">Total' + daParte + ' no período: <b>' + brl(totDiv) + '</b>.</div>';
  }
  h += '</div>';

  /* 5 — Já comprometido. Olha para a frente, então é o único que não segue o
     período; segue o "de quem". O mês abre AQUI, e não num atalho para o
     Início: as recorrências de um mês futuro ainda não existem como lançamento
     (A18), e o Início filtrado mostraria só as parcelas. */
  const porMes = (r.fixa + r.variavel) / Math.max(1, r.meses);
  h += '<div class="card dash-card"><h3>Já comprometido</h3><div class="sub">' +
       (todos ? 'O que os próximos meses já têm antes de qualquer compra nova.' : 'A parte ' + (DASH.pessoa === 'maria' ? 'da Maria' : 'do Irwin') + ' no que os próximos meses já têm.') +
       ' Olha para a frente, então não segue o período. Toque no mês para ver o quê.</div>';
  DASH.comprometido.forEach(function(m, k){
    const partes = [m.recorrencias.length + ' recorrências'];
    if (m.parcelas.length) partes.push(m.parcelas.length + ' parcelas');
    if (m.avulsos.length) partes.push(m.avulsos.length + ' avulsos');
    h += '<button type="button" class="mes-lin' + (k === 0 ? ' primeira' : '') + '" aria-expanded="false">' +
         '<span class="quem"><b>' + cap(m.mes) + '</b><small>' + partes.join(' + ') + '</small></span>' +
         '<span class="total">' + brl(m.total) + '</span>' +
         '<svg class="seta-mes" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>' +
         '<div class="mes-itens" hidden>' + grupoItens('recorrências', m.recorrencias, 'rec') + grupoItens('parcelas', m.parcelas, 'parc') + grupoItens('avulsos', m.avulsos, 'parc') + '</div>';
  });
  const c0 = DASH.comprometido[0];
  if (c0 && porMes > 0) h += '<div class="nota-dash">' + cap(c0.mes) + ' já tem <b>' + brl(c0.total) + '</b>' + daParte + ' antes de começar — ' + Math.round(c0.total / porMes * 100) + '% do que ' + gastouN + ' por mês no período.</div>';
  h += '</div>';

  el.innerHTML = h;
  // Muitas barras rolam na horizontal; nascem no fim, no mês mais recente.
  el.querySelectorAll('.colunas.muitas').forEach(function(f){ f.scrollLeft = f.scrollWidth; });
}

    '<div class="nota">Conexão direta com o banco não está disponível — o caminho é importar o extrato exportado pelo app do banco. Em PDF a leitura é experimental: revise a lista com atenção antes de confirmar.</div>';
  $('dropzone').onclick = function(){ $('arquivoInput').value = ''; $('arquivoInput').click(); };
}
renderImportInicial();

/* carrega uma lib externa uma única vez (CDN, sob demanda) */
function carregarScript(src, cb){
  const jaTem = Array.prototype.some.call(document.getElementsByTagName('script'), function(s){ return s.src === src; });
  if (jaTem) return cb();
  const s = document.createElement('script');
  s.src = src;
  s.onload = cb;
  s.onerror = function(){ $('importConteudo').innerHTML = '<div class="msg-erro on">Não foi possível carregar o leitor desse formato. Verifique a conexão e tente de novo.</div>'; };
  document.head.appendChild(s);
}

function xlsxParaCSV(arrayBuffer, cb){
  carregarScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', function(){
    const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
    const planilha = wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_csv(planilha));
  });
}

function pdfParaTexto(arrayBuffer, cb){
  carregarScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', function(){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdf){
      const paginas = [];
      for (let i = 1; i <= pdf.numPages; i++) paginas.push(pdf.getPage(i));
      Promise.all(paginas).then(function(pgs){
        Promise.all(pgs.map(function(pg){ return pg.getTextContent(); })).then(function(conteudos){
          const texto = conteudos.map(function(tc){
            const linhas = {};
            tc.items.forEach(function(item){
              const y = Math.round(item.transform[5]);
              (linhas[y] = linhas[y] || []).push(item.str);
            });
            return Object.keys(linhas).sort(function(a,b){ return b - a; }).map(function(y){ return linhas[y].join(' '); }).join('\n');
          }).join('\n');
          cb(texto);
        });
      });
    }).catch(function(){
      $('importConteudo').innerHTML = '<div class="msg-erro on">Não foi possível ler esse PDF.</div>';
    });
  });
}

function enviarParaPreview(conteudo, tipo){
  google.script.run.withSuccessHandler(function(lista){
    IMP.transacoes = lista.map(function(t){ return Object.assign({incluir:true}, t); });
    renderImportLote();
  }).withFailureHandler(function(e){
    $('importConteudo').innerHTML = '<div class="msg-erro on">Erro ao ler o arquivo: ' + escapeHtml(e.message) + '</div>';
  }).previewImportacao(conteudo, tipo);
}

$('arquivoInput').onchange = function(){
  const f = this.files[0];
  if (!f) return;
  const nome = f.name.toLowerCase();

  if (nome.endsWith('.xlsx')){
    $('importConteudo').innerHTML = '<div class="vazio">Lendo XLSX…</div>';
    const reader = new FileReader();
    reader.onload = function(){ xlsxParaCSV(reader.result, function(csv){ enviarParaPreview(csv, 'csv'); }); };
    reader.readAsArrayBuffer(f);
    return;
  }
  if (nome.endsWith('.pdf')){
    $('importConteudo').innerHTML = '<div class="vazio">Lendo PDF, pode levar alguns segundos…</div>';
    const reader = new FileReader();
    reader.onload = function(){ pdfParaTexto(reader.result, function(texto){ enviarParaPreview(texto, 'pdf'); }); };
    reader.readAsArrayBuffer(f);
    return;
  }

  const tipo = nome.endsWith('.ofx') ? 'ofx' : 'csv';
  $('importConteudo').innerHTML = '<div class="vazio">Lendo extrato…</div>';
  const reader = new FileReader();
  reader.onload = function(){ enviarParaPreview(reader.result, tipo); };
  reader.readAsText(f);
};

function renderImportLote(){
  const n = IMP.transacoes.length;
  const total = IMP.transacoes.reduce(function(a,t){ return a+Number(t.valor); }, 0);

  let h = '<div class="campo"><label>Lançar todas as ' + n + ' transações como</label><div class="chips" id="chipsImpQuem"></div></div>';
  h += '<div class="campo" id="campoImpDivisao" style="display:none"><label>Como dividir entre os dois</label><div class="chips" id="chipsImpDivisao"></div></div>';
  h += '<div class="nota" style="margin-top:0">Categoria sugerida pela descrição — revise antes de confirmar; o que não der pra identificar cai em "Outros".</div>';
  h += '<div class="card" style="margin-top:12px" id="listaImp"></div>';

  $('importConteudo').innerHTML = h;

  const cQuem = $('chipsImpQuem');
  ['Irwin','Maria','Ambos'].forEach(function(p){
    chip(cQuem, p, p === IMP.quem, PESSOA[p].forte, PESSOA[p].clara, function(){ IMP.quem = p; renderImportLote(); });
  });
  $('campoImpDivisao').style.display = (IMP.quem === 'Ambos') ? 'block' : 'none';
  if (IMP.quem === 'Ambos'){
    const cDiv = $('chipsImpDivisao');
    [['Renda','Por renda'],['50/50','50/50']].forEach(function(o){
      const b = chip(cDiv, o[1], IMP.divisao === o[0], '#2F5233', 'var(--chip-neutro)', function(){ IMP.divisao = o[0]; renderImportLote(); });
      b.classList.add('seg');
    });
  }

  let li = '';
  IMP.transacoes.forEach(function(t){
    const cor = CATS[t.categoria] || {forte:'#6E6E6E', clara:'#E8E8E8'};
    const dd = t.data ? t.data.slice(8,10) : '';
    const mm = t.data ? ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'][Number(t.data.slice(5,7))-1] : '';
    li += '<div class="imp-item"><div class="col-data"><div class="dia">' + dd + '</div><div class="mes">' + mm + '</div></div>' +
      '<div style="flex:1"><div class="desc">' + escapeHtml(t.descricao) + '</div>' +
      '<span class="pill" style="background:' + cor.clara + ';color:' + cor.forte + '">' + escapeHtml(t.categoria.replace(/^\d+\s/, '')) + '</span></div>' +
      '<div class="valor">' + brl(t.valor) + '</div></div>';
  });
  $('listaImp').innerHTML = li || '<div class="vazio">Nenhuma transação reconhecida no arquivo.</div>';

  const barraExistente = document.getElementById('barraImportar');
  if (barraExistente) barraExistente.remove();
  if (n > 0){
    const barra = document.createElement('div');
    barra.className = 'barra-acao'; barra.id = 'barraImportar';
    barra.innerHTML = '<button class="btn-full valido" id="btnConfirmarImp">Lançar ' + n + ' transações · ' + brl(total) + '</button>';
    $('content').insertBefore(barra, null);
    $('app').insertBefore(barra, $('tabbar'));
    $('btnConfirmarImp').onclick = confirmarImportacao;
  }
}

function confirmarImportacao(){
  const b = $('btnConfirmarImp'); b.disabled = true; b.textContent = 'Lançando…';
  google.script.run.withSuccessHandler(function(r){
    const barra = document.getElementById('barraImportar'); if (barra) barra.remove();
    mostrarSucesso('Extrato importado', r.qtd + ' transações — ' + brl(r.total));
    carregarUltimos(); carregarAcerto(); DASH = null;
    renderImportInicial();
  }).withFailureHandler(function(e){
    b.disabled = false; b.textContent = 'Tentar novamente';
    alert('Erro: ' + e.message);
  }).lancarImportacaoLote(IMP.transacoes, IMP.quem, IMP.divisao);
}

/* ---------------- overlay sucesso ---------------- */
function mostrarSucesso(titulo, msg){
  $('overlayTitulo').textContent = titulo;
  $('overlayMsg').textContent = msg;
  $('overlaySucesso').classList.add('on');
}
$('btnOverlayOk').onclick = function(){
  $('overlaySucesso').classList.remove('on');
  tabAtiva = 'home';
  irPara('home');
};

irPara('home');
</script>
